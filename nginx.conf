worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Preserve original X-Forwarded headers if present, otherwise set them
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 3009 default_server;
        server_name _;

        # Serve Next.js static files directly
        location /_next/static/ {
            alias /app/.next/static/;
            expires 365d;
            access_log off;
        }

        # Serve public directory files directly if they exist, otherwise proxy
        location / {
            root /app/public;
            try_files $uri $uri/ @nextjs;
        }

        # Proxy all other requests to the Next.js standalone server
        location @nextjs {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            # Additional headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
