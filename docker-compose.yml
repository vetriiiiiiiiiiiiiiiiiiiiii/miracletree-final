services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miracletree-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3009:3009"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=mongodb://mongodb:27017/miracletree?replicaSet=rs0
      - AUTH_TRUST_HOST=true
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - miracletree_media:/app/public/uploads

  mongodb:
    image: mongo:7.0.14
    container_name: miracletree-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}) }'"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - miracletree_mongo_data:/data/db


volumes:
  miracletree_mongo_data:
  miracletree_media:
