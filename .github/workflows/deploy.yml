name: "deploy:miracletree-final"

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: deploy-to-vps
    runs-on: ubuntu-latest

    steps:
      # Method 2: Safely print the key text by spacing out characters (bypasses GitHub log masking)
      - name: View Raw Key Text Safely
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "=== START OF SSH KEY (SPACED OUT FOR DEBUG) ==="
          echo "$SSH_KEY" | sed 's/./& /g'
          echo "=== END OF SSH KEY ==="

      - name: Deploy miracletree-final app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "Successfully connected via SSH. Starting deployment commands..."
            cd /var/www/clients/miracletree
            
            # NOTE: Script runs as root, so ownership/permissions shouldn't be an issue.
            
            # Resolve potential git ownership issues
            git config --global --add safe.directory /var/www/clients/miracletree
            
            # Fetch and reset without sudo (assuming ownership is fixed)
            git fetch origin main
            git reset --hard origin/main
            
            # Ensure .env exists to prevent docker compose build errors (if needed)
            touch .env
            
            # Zero-downtime deployment: build new images first, apply them, then clean up old dangling images
            docker compose build --no-cache
            docker compose up -d --force-recreate --remove-orphans
            docker builder prune -f
            
            # Output logs for verification
            sleep 10
            docker compose logs --tail 300 web
